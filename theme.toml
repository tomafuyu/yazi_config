#:schema https://yazi-rs.github.io/schemas/theme.json

# Base: Bluloco dark flavour for Yazi
#  

# black : #001122
# white : #ddeeff
# main  : #11aaff
# delim : #7788dd
# image : #33ff55
# video : #00aa00
# audio : #88ddff
# red   : #ff6688
# : #aabbcc

[count]
copied = "󰆏 "
cut = "󰆐 "
marked = ""
selected = "󰄬 "
sep_left = ""
sep_right = ""

# [app]
# overall = { bg = "#001122" }

[mgr]
cwd = { fg = "#11aaff" }
symlink_target = { italic = true }
marker_copied = { fg = "#33ff55", bg = "#33ff55" }
marker_cut = { fg = "#ff6688", bg = "#ff6688" }
marker_marked = { fg = "#7788dd", bg = "#7788dd" }
marker_selected = { fg = "#22ccff", bg = "#22ccff" }
count_copied = { fg = "#001122", bg = "#33ff55" }
count_cut = { fg = "#001122", bg = "#ff6688" }
count_selected = { fg = "#001122", bg = "#22ccff" }
border_symbol = "│"
border_style = { fg = "#7788dd" }

[mgr.find_keyword]
fg = "#E3B80D"
bg = "#1A7247"
bold = true
italic = true
underline = true

[mgr.find_position]
fg = "#aabbcc"
bg = "reset"
bold = true
italic = true

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#001122", bg = "#11aaff" }
inactive = { fg = "#aabbcc", bg = "#001122" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#001122", bg = "#11aaff" }
normal_alt = { fg = "#ddeeff", bg = "#001122" }
select_main = { fg = "#001122", bg = "#9F7EFE" }
select_alt = { fg = "#9F7EFE", bg = "#001122" }
unset_main = { fg = "#001122", bg = "#ff6688" }
unset_alt = { fg = "#ff6688", bg = "#001122" }

[status]
overall = { fg = "#aabbcc" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#5F697C" }
perm_type = { fg = "#11aaff" }
perm_read = { fg = "#9F7EFE" }
perm_write = { fg = "#FC2E51" }
perm_exec = { fg = "#3FC56B" }
progress_label = { fg = "#001122", bold = true }
progress_normal = { fg = "#9F7EFE", bg = "#636D83" }
progress_error = { fg = "#ff6688", bg = "#FDCFD1" }

[which]
border = { fg = "#7788dd" }
cols = 3
mask = { bg = "#001122" }
cand = { fg = "#ff9966" }
desc = { fg = "#ddeeff" }
separator = " ➜ "
separator_style = { fg = "#7788dd" }

[confirm]
border = { fg = "#7788dd" }
title = { fg = "#ddeeff" }
body = {}
list = {}
btn_yes = { fg = "#33ff55" }
btn_no = { fg = "#ff6688" }
btn_labels = ["Yes", "No"]

[spot]
border = { fg = "#7788dd" }
title = { fg = "#ddeeff" }
tbl_col = { fg = "#3691FF" }
tbl_cell = { bg = "#274670" }

[notify]
title_info = { fg = "#3691FF" }
title_warn = { fg = "#DA7A43" }
title_error = { fg = "#ff6688" }
icon_info = ""
icon_warn = ""
icon_error = ""

[pick]
border = { fg = "#7788dd" }
active = { fg = "#F9C859", bold = true }
inactive = {}

[input]
border = { fg = "#7788dd" }
title = { fg = "#ddeeff" }
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#7788dd" }
active = { bg = "#274670" }
inactive = {}
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#7788dd" }
title = { fg = "#ddeeff" }
hovered = { bg = "#274670", bold = true }

[help]
border = { fg = "#7788dd" }
chord = { fg = "#FF936A" }
action = { fg = "#11aaff" }
hovered = { bg = "#001122", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#33ff55" },
	{ mime = "**/video/*", fg = "#00aa00" },
	{ mime = "**/audio/*", fg = "#88ddff" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FF9966" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#50ACAE" },
	{ mime = "vfs/{absent,stale}", fg = "#636D83" },
	{ url = "*", is = "orphan", fg = "#001122", bg = "#ff6688" },
	{ url = "*", is = "exec", fg = "#3FC56B" },
	{ url = "*", is = "dummy", fg = "#001122", bg = "#ff6688" },
	{ url = "*/", is = "dummy", fg = "#001122", bg = "#ff6688" },
	{ url = "*", fg = "#ddeeff" },
	{ url = "*/", fg = "#11aaff" },
]

[icon]
prepend_conds = [
	{ if = "dir & hovered", text = "", fg = "#11aaff" },
	{ if = "dir", text = "", fg = "#11aaff" },
]
prepend_dirs = [
	{ name = ".config", text = "", fg = "#11aaff" },
	{ name = ".git", text = "", fg = "#11aaff" },
	{ name = ".github", text = "", fg = "#11aaff" },
	{ name = ".npm", text = "", fg = "#11aaff" },
	{ name = "Desktop", text = "", fg = "#11aaff" },
	{ name = "Development", text = "", fg = "#11aaff" },
	{ name = "Downloads", text = "", fg = "#11aaff" },
	{ name = "Documents", text = "", fg = "#11aaff" },
	{ name = "Library", text = "", fg = "#11aaff" },
	{ name = "Movies", text = "", fg = "#00aa00" },
	{ name = "Music", text = "", fg = "#88ddff" },
	{ name = "Pictures", text = "", fg = "#33ff55" },
	{ name = "Public", text = "", fg = "#11aaff" },
	{ name = "Videos", text = "", fg = "#00aa00" },
]

[git]
unknown_sign  = " "
unstaged_sign = "M"
deleted_sign  = "D"
clean_sign    = "✔"
unstaged = { fg = "#11aaff" }
staged = { fg = "#11aaff" }
added = { fg = "#3FC56B" }
untracked = { fg = "#636D83" }
ignored = { fg = "#636D83" }
deleted = { fg = "#ff6688" }
updated = { fg = "#FF78F8" }

