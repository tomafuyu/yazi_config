# Base: Bluloco dark flavour for Yazi
# schema: https://yazi-rs.github.io/schemas/theme.json
#  

[counticon]
copied = "󰆏 "
cut = "󰆐 "
marked = ""
selected = "󰄬 "
sep_left = ""
sep_right = ""

# [app]
# overall = { bg = "#222222" }

[mgr]
cwd = { fg = "#22ccff" }
symlink_target = { italic = true }
marker_copied = { fg = "#F9C859", bg = "#F9C859" }
marker_cut = { fg = "#ee3355", bg = "#ee3355" }
marker_marked = { fg = "#7788dd", bg = "#7788dd" }
marker_selected = { fg = "#22ccff", bg = "#22ccff" }
count_copied = { fg = "#222222", bg = "#F9C859" }
count_cut = { fg = "#222222", bg = "#ee3355" }
count_selected = { fg = "#222222", bg = "#22ccff" }
border_symbol = "│"
border_style = { fg = "#7788dd" }

[mgr.find_keyword]
fg = "#E3B80D"
bg = "#1A7247"
bold = true
italic = true
underline = true

[mgr.find_position]
fg = "#ABB2BF"
bg = "reset"
bold = true
italic = true

[indicator]
parent = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#222222", bg = "#11aaff" }
inactive = { fg = "#bbbbbb", bg = "#222222" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#222222", bg = "#11aaff" }
normal_alt = { fg = "#ddeeff", bg = "#222222" }
select_main = { fg = "#222222", bg = "#9F7EFE" }
select_alt = { fg = "#9F7EFE", bg = "#222222" }
unset_main = { fg = "#222222", bg = "#ee3355" }
unset_alt = { fg = "#ee3355", bg = "#222222" }


[status]
overall = { fg = "#bbbbbb" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#5F697C" }
perm_type = { fg = "#11aaff" }
perm_read = { fg = "#9F7EFE" }
perm_write = { fg = "#FC2E51" }
perm_exec = { fg = "#3FC56B" }
progress_label = { fg = "#282C34", bold = true }
progress_normal = { fg = "#9F7EFE", bg = "#636D83" }
progress_error = { fg = "#FF2E3F", bg = "#FDCFD1" }


[which]
border = { fg = "#7788dd" }
cols = 3
mask = { bg = "#21232C" }
cand = { fg = "#ff9966" }
desc = { fg = "#ddeeff" }
separator = " ➜ "
separator_style = { fg = "#7788dd" }


[confirm]
border = { fg = "#7788dd" }
title = { fg = "#7A82DA" }
body = {}
list = {}
btn_yes = { fg = "#3FC56B" }
btn_no = { fg = "#FC2E51" }
btn_labels = ["Yes", "No"]


[spot]
border = { fg = "#7788dd" }
title = { fg = "#7A82DA" }
tbl_col = { fg = "#3691FF" }
tbl_cell = { bg = "#274670" }

[notify]
title_info = { fg = "#3691FF" }
title_warn = { fg = "#DA7A43" }
title_error = { fg = "#FF2E3F" }
icon_info = ""
icon_warn = ""
icon_error = ""

[pick]
border = { fg = "#7788dd" }
active = { fg = "#F9C859", bold = true }
inactive = {}

[input]
border = { fg = "#7788dd" }
title = { fg = "#7A82DA" }
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#7788dd" }
active = { bg = "#274670" }
inactive = {}
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "#7788dd" }
title = { fg = "#7A82DA" }
hovered = { bg = "#274670", bold = true }

[help]
border = { fg = "#7788dd" }
chord = { fg = "#FF936A" }
action = { fg = "#11aaff" }
hovered = { bg = "#274670", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#33ff55" },
	{ mime = "**/video/*", fg = "#9F7EFE" },
	{ mime = "**/audio/*", fg = "#aaeeff" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#FF9966" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#50ACAE" },
	{ mime = "vfs/{absent,stale}", fg = "#636D83" },
	{ url = "*", is = "orphan", fg = "#282C34", bg = "#FF2E3F" },
	{ url = "*", is = "exec", fg = "#3FC56B" },
	{ url = "*", is = "dummy", fg = "#282C34", bg = "#FF2E3F" },
	{ url = "*/", is = "dummy", fg = "#282C34", bg = "#FF2E3F" },
	{ url = "*", fg = "#ddeeff" },
	{ url = "*/", fg = "#11aaff" },
]

[icon]
prepend_conds = [
	{ if = "dir & hovered", text = "", fg = "#11aaff" },
	{ if = "dir", text = "", fg = "#11aaff" },
]
prepend_dirs = [
	{ name = ".config", text = "", fg = "#11aaff" },
	{ name = ".git", text = "", fg = "#11aaff" },
	{ name = ".github", text = "", fg = "#11aaff" },
	{ name = ".npm", text = "", fg = "#11aaff" },
	{ name = "Desktop", text = "", fg = "#11aaff" },
	{ name = "Development", text = "", fg = "#11aaff" },
	{ name = "Downloads", text = "", fg = "#11aaff" },
	{ name = "Documents", text = "", fg = "#11aaff" },
	{ name = "Library", text = "", fg = "#11aaff" },
	{ name = "Movies", text = "", fg = "#11aaff" },
	{ name = "Music", text = "", fg = "#11aaff" },
	{ name = "Pictures", text = "", fg = "#11aaff" },
	{ name = "Public", text = "", fg = "#11aaff" },
	{ name = "Videos", text = "", fg = "#11aaff" },
]

[git]
unstaged = { fg = "#11aaff" }
staged = { fg = "#11aaff" }
added = { fg = "#3FC56B" }
untracked = { fg = "#636D83" }
ignored = { fg = "#636D83" }
deleted = { fg = "#FF6480" }
updated = { fg = "#FF78F8" }

